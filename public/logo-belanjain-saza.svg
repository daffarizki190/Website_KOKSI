<svg width="600" height="120" viewBox="0 0 600 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Icon Gradient -->
    <linearGradient id="iconGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d9488" />
      <stop offset="50%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    
    <!-- SAZA Badge Gradient -->
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
  </defs>

  <!-- Logo Icon -->
  <rect x="10" y="20" width="80" height="80" rx="20" fill="url(#iconGrad)" />
  <g transform="translate(30, 40) scale(1.666)" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z" />
    <path d="M3 6h18" />
    <path d="M16 10a4 4 0 0 1-8 0" />
  </g>

  <!-- Text "belanjain" -->
  <text x="110" y="80" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="56" fill="#0f172a" letter-spacing="-2">
    belanja<tspan fill="#f59e0b" font-style="italic">in</tspan>
  </text>

  <!-- SAZA Premium Badge -->
  <!-- Posisi tepat di sebelah kanan teks "belanjain" -->
  <g transform="translate(370, 42)">
    <rect x="0" y="0" width="80" height="32" rx="16" fill="url(#badgeGrad)" />
    <text x="40" y="22" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="16" fill="#ffffff" text-anchor="middle" letter-spacing="2">SAZA</text>
  </g>
  
  <!-- Subtitle Tagline -->
  <text x="114" y="105" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="14" fill="#64748b" letter-spacing="2" text-transform="uppercase">
    Platform Belanja Karyawan
  </text>
</svg>
